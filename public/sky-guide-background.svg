<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="none">
  <defs>
    <!-- Overall cool blue field -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#285fe0"/>
      <stop offset="16%" stop-color="#78a9e6"/>
      <stop offset="36%" stop-color="#6fc4e2"/>
      <stop offset="68%" stop-color="#70addf"/>
      <stop offset="100%" stop-color="#8cb9df"/>
    </linearGradient>

    <!-- Pale mint/white bloom at upper-left -->
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 200) scale(305 265)">
      <stop offset="0%" stop-color="#ecf4da" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d7eddc" stop-opacity="0.66"/>
      <stop offset="70%" stop-color="#b6dcdf" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b6dcdf" stop-opacity="0"/>
    </radialGradient>

    <!-- Large aqua/cyan body on right -->
    <radialGradient id="rightAqua" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(690 300) scale(355 370)">
      <stop offset="0%" stop-color="#b5f0df" stop-opacity="0.92"/>
      <stop offset="33%" stop-color="#7de6df" stop-opacity="0.80"/>
      <stop offset="67%" stop-color="#50d8de" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#50d8de" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal core near upper-right-middle -->
    <radialGradient id="tealCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(575 235) scale(185 170)">
      <stop offset="0%" stop-color="#29d9cf" stop-opacity="0.90"/>
      <stop offset="45%" stop-color="#38d6d4" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#38d6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep blue well through the centre-left -->
    <radialGradient id="blueWell" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(310 380) scale(345 330)">
      <stop offset="0%" stop-color="#3b9fe0" stop-opacity="0.66"/>
      <stop offset="55%" stop-color="#427fdb" stop-opacity="0.31"/>
      <stop offset="100%" stop-color="#4a72d7" stop-opacity="0"/>
    </radialGradient>

    <!-- Slight lavender cast in lower-left -->
    <radialGradient id="lavender" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(80 515) scale(280 185)">
      <stop offset="0%" stop-color="#8aa3e7" stop-opacity="0.48"/>
      <stop offset="70%" stop-color="#839adf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#839adf" stop-opacity="0"/>
    </radialGradient>

    <!-- Pale cyan highlight around the right edge -->
    <radialGradient id="edgeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(790 445) scale(170 260)">
      <stop offset="0%" stop-color="#78f2df" stop-opacity="0.85"/>
      <stop offset="48%" stop-color="#8cebdd" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8cebdd" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom haze -->
    <linearGradient id="bottomHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6e6ef" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d9e8ed" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#base)"/>
  <rect width="800" height="600" fill="url(#leftGlow)"/>
  <rect width="800" height="600" fill="url(#blueWell)"/>
  <rect width="800" height="600" fill="url(#rightAqua)"/>
  <rect width="800" height="600" fill="url(#tealCore)"/>
  <rect width="800" height="600" fill="url(#lavender)"/>
  <rect width="800" height="600" fill="url(#edgeGlow)"/>
  <rect y="470" width="800" height="130" fill="url(#bottomHaze)"/>
</svg>
